<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sections of one page</title>
</head>
<body>
  <nav>
    <a href="/">Home of the site</a>
  </nav>
  <main id="main">
    <p>A paragraph straight in the page.</p>
    <section id="hero-banner-main-area">
      <h1>The hero headline here</h1>
    </section>
    <section id="operating">
      <article>
        <h3>Outright acquisition</h3>
        <p>Psyon acquires the data from you.</p>
      </article>
    </section>
    <section id="faq">
      <article>
        <p>An answer with no heading of its own.</p>
      </article>
    </section>
    <section id="offer">
      <section id="pricing" aria-label="Our pricing plans">
        <p>Plans for every team size.</p>
      </section>
    </section>
  </main>
</body>
</html>
